services:
  # Backend Web Service
  - type: web
    name: quantum-lab-api
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false

  # Frontend Static Site
  - type: static
    name: quantum-lab-ui
    env: static
    region: singapore
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishDir: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
